<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader - Video & Foto</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f4f4f0; --ink: #111111; --pink: #ff3b7a; --cyan: #45ffe8;
        --yellow: #ffd645; --white: #ffffff; --border: 2.5px solid var(--ink);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 500px; background: var(--white); border: var(--border); box-shadow: 8px 8px 0 var(--pink); padding: 40px 30px; }
    .logo { font-size: 32px; font-weight: 900; text-align: center; margin-bottom: 8px; }
    .logo span { color: var(--pink); -webkit-text-stroke: 1px var(--ink); }
    .subtitle { text-align: center; font-size: 14px; font-weight: 600; color: #666; margin-bottom: 30px; }
    
    input { width: 100%; padding: 16px; border: var(--border); border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; outline: none; box-shadow: 3px 3px 0 var(--ink); margin-bottom: 15px; }
    input:focus { box-shadow: 5px 5px 0 var(--yellow); transform: translate(-2px, -2px); }
    
    button { width: 100%; padding: 16px; background: var(--ink); color: var(--white); border: var(--border); border-radius: 12px; font-weight: 800; font-size: 16px; text-transform: uppercase; cursor: pointer; box-shadow: 4px 4px 0 var(--pink); transition: 0.1s; }
    button:hover { transform: translate(4px, 4px); box-shadow: none; }
    button:disabled { background: #ccc; cursor: not-allowed; }

    .status { margin-top: 20px; text-align: center; display: none; padding: 15px; background: var(--cyan); border: var(--border); border-radius: 12px; font-weight: 700; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: var(--ink); animation: spin 1s infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .result-box { display: none; margin-top: 30px; padding-top: 30px; border-top: 2px dashed #ccc; }
    .video-preview { width: 100%; border: var(--border); border-radius: 12px; margin-bottom: 15px; background: #000; max-height: 400px; }
    .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .photo-item { border: var(--border); border-radius: 8px; overflow: hidden; position: relative; }
    .photo-item img { width: 100%; height: 150px; object-fit: cover; display: block; }
    .photo-item button { position: absolute; bottom: 5px; right: 5px; width: auto; padding: 5px 10px; font-size: 12px; background: var(--yellow); color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    
    .info { font-size: 14px; font-weight: 600; background: var(--bg); padding: 12px; border: 2px solid var(--ink); border-radius: 8px; margin-bottom: 15px; }
    .btn-save { background: var(--yellow); color: var(--ink); }
</style>
</head>
<body>

<div class="container">
    <div class="logo">TikTok<span>DL.</span></div>
    <div class="subtitle">Download Video & Foto</div>

    <form onsubmit="processLink(event)">
        <input type="url" id="urlInput" placeholder="Paste link TikTok di sini..." required>
        <button type="submit" id="submitBtn">Proses Link</button>
    </form>

    <div class="status" id="status">Memproses data...</div>

    <div class="result-box" id="result">
        <div id="mediaContainer"></div>
        <div class="info" id="info"></div>
        <div id="actionArea"></div>
    </div>
</div>

<script>
    async function processLink(e) {
    e.preventDefault();
    const url = document.getElementById('urlInput').value;
    const status = document.getElementById('status');
    const result = document.getElementById('result');
    const mediaContainer = document.getElementById('mediaContainer');
    const actionArea = document.getElementById('actionArea');
    const submitBtn = document.getElementById('submitBtn');

    result.style.display = 'none';
    mediaContainer.innerHTML = '';
    actionArea.innerHTML = '';
    status.style.display = 'block';
    submitBtn.disabled = true;

    try {
        // PAKE API TIKLYDOWN (Lebih stabil buat client-side)
        const res = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        status.style.display = 'none';
        submitBtn.disabled = false;

        // Cek struktur data dari API baru
        if (data && data.video) {
            // Tampilkan Info
            document.getElementById('info').innerHTML = `
                <strong>${data.title || 'TikTok Media'}</strong><br>
                <span style="color:#666;">@${data.author?.unique_id || 'user'}</span>
            `;

            // JIKA VIDEO
            if (data.video.playAddr) {
                const video = document.createElement('video');
                video.className = 'video-preview';
                video.src = data.video.playAddr;
                video.controls = true;
                mediaContainer.appendChild(video);
                
                actionArea.innerHTML = `<button class="btn-save" onclick="downloadFile('${data.video.playAddr}', 'video.mp4')">Simpan Video</button>`;
            } 
            // JIKA FOTO
            else if (data.images && data.images.length > 0) {
                const grid = document.createElement('div');
                grid.className = 'photo-grid';
                data.images.forEach((img, i) => {
                    const div = document.createElement('div');
                    div.className = 'photo-item';
                    div.innerHTML = `
                        <img src="${img}">
                        <button onclick="downloadFile('${img}', 'foto-${i+1}.jpg')">⬇ Save</button>
                    `;
                    grid.appendChild(div);
                });
                mediaContainer.appendChild(grid);
                actionArea.innerHTML = `<button class="btn-save" onclick="downloadFile('${data.images[0]}', 'foto-1.jpg')">Download Foto</button>`;
            }
            
            result.style.display = 'block';
        } else {
            alert("Gagal: API tidak mengembalikan data video. Coba link lain.");
        }
    } catch (error) {
        console.error(error);
        status.style.display = 'none';
        submitBtn.disabled = false;
        alert("Terjadi kesalahan jaringan atau API sedang down.");
    }
}
</script>
</body>
</html>
