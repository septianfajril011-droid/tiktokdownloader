<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Downloader - No Watermark</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    /* ═══ ROOT & RESET ═══ */
    :root {
        --bg: #f4f4f0;
        --ink: #111111;
        --pink: #ff3b7a;
        --cyan: #45ffe8;
        --yellow: #ffd645;
        --white: #ffffff;
        --border: 2.5px solid var(--ink);
        --shadow: 5px 5px 0 var(--ink);
        --shadow-lg: 8px 8px 0 var(--pink);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: var(--bg);
        color: var(--ink);
        font-family: 'Plus Jakarta Sans', sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    /* ═══ CONTAINER ═══ */
    .container {
        width: 100%;
        max-width: 500px;
        background: var(--white);
        border: var(--border);
        box-shadow: var(--shadow-lg);
        padding: 40px 30px;
        position: relative;
        overflow: hidden;
    }

    /* Header */
    .logo {
        font-size: 36px;
        font-weight: 900;
        text-align: center;
        letter-spacing: -1.5px;
        margin-bottom: 8px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }
    .logo svg { width: 32px; height: 32px; fill: var(--ink); }
    .logo span { color: var(--pink); -webkit-text-stroke: 1.5px var(--ink); }
    .subtitle { text-align: center; font-size: 14px; font-weight: 600; color: #666; margin-bottom: 30px; }

    /* Form Input */
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input {
        width: 100%; padding: 18px 20px; border: var(--border); border-radius: 12px;
        font-family: inherit; font-size: 14px; font-weight: 600; outline: none;
        box-shadow: 3px 3px 0 var(--ink); transition: all 0.2s;
    }
    .input-group input:focus { box-shadow: 5px 5px 0 var(--yellow); transform: translate(-2px, -2px); }

    /* Tombol */
    .btn-download {
        width: 100%; padding: 18px; background: var(--ink); color: var(--white);
        border: var(--border); border-radius: 12px; font-family: inherit;
        font-size: 16px; font-weight: 800; text-transform: uppercase; cursor: pointer;
        box-shadow: 4px 4px 0 var(--pink); transition: all 0.1s;
        display: flex; justify-content: center; align-items: center; gap: 10px;
    }
    .btn-download:hover { transform: translate(4px, 4px); box-shadow: none; }
    .btn-download:disabled { background: #ccc; color: #666; box-shadow: none; cursor: not-allowed; }

    /* Loading / Status */
    .status {
        margin-top: 20px; text-align: center; font-size: 14px; font-weight: 700;
        display: none; padding: 15px; background: var(--cyan);
        border: var(--border); border-radius: 12px; box-shadow: 3px 3px 0 var(--ink);
    }
    .spinner {
        display: inline-block; width: 20px; height: 20px;
        border: 3px solid rgba(0,0,0,0.1); border-radius: 50%; border-top-color: var(--ink);
        animation: spin 1s ease-in-out infinite; vertical-align: middle; margin-right: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Hasil Video */
    .result-box { display: none; margin-top: 30px; padding-top: 30px; border-top: 2px dashed #ccc; }
    .video-preview {
        width: 100%; border: var(--border); border-radius: 12px; margin-bottom: 20px;
        box-shadow: 4px 4px 0 var(--ink); background: #000; max-height: 400px;
    }
    .video-info {
        font-size: 14px; font-weight: 600; margin-bottom: 20px; line-height: 1.5;
        background: var(--bg); padding: 12px; border: 2px solid var(--ink); border-radius: 8px;
    }
    .video-info span { display: block; font-size: 12px; color: #666; margin-top: 4px; }
    .btn-save {
        display: block; width: 100%; padding: 16px; background: var(--yellow); color: var(--ink);
        text-align: center; text-decoration: none; border: var(--border); border-radius: 12px;
        font-weight: 800; text-transform: uppercase; box-shadow: 3px 3px 0 var(--ink); transition: 0.1s;
    }
    .btn-save:hover { transform: translate(3px, 3px); box-shadow: none; }
</style>
</head>
<body>

<div class="container">
    <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/></svg>
        TikTok<span>DL.</span>
    </div>
    <div class="subtitle">Download video tanpa watermark</div>

    <!-- FORM INPUT -->
    <form id="downloadForm" onsubmit="handleDownload(event)">
        <div class="input-group">
            <input type="url" id="tiktokUrl" placeholder="Paste link TikTok di sini..." required>
        </div>
        <button type="submit" class="btn-download" id="submitBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download Video
        </button>
    </form>

    <!-- STATUS -->
    <div class="status" id="statusText">
        <span class="spinner"></span> Sedang memproses video...
    </div>

    <!-- HASIL -->
    <div class="result-box" id="resultBox">
        <video id="videoPreview" class="video-preview" controls></video>
        <div class="video-info" id="videoInfo">
            Judul Video
            <span id="authorInfo">@username</span>
        </div>
        <!-- Tombol Download -->
        <button id="downloadBtn" class="btn-save" onclick="forceDownload()">Simpan ke Galeri / Download</button>
    </div>
</div>

<script>
    // ═══ LOGIKA UTAMA (INTEGRASI TIKWM API) ═══
    async function handleDownload(event) {
        event.preventDefault();
        
        const url = document.getElementById('tiktokUrl').value;
        const status = document.getElementById('statusText');
        const resultBox = document.getElementById('resultBox');
        const mediaContainer = document.getElementById('mediaContainer')
        const actionButtons = document.getElementById('actionButtons')
        const submitBtn = document.getElementById('submitBtn');

        // Reset tampilan
        resultBox.style.display = 'none';
        mediaContainer.innerHTML =' ' 
        actionButtons.innerHTML =' '
        status.style.display = 'block';
        submitBtn.disabled = true;

        try {
            // Panggil API TikWM
            const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            // Sembunyiin loading
            status.style.display = 'none';
            submitBtn.disabled = false;

            if (data.code === 0 && data.data) {
                const videoData = data.data;

                document.getElementById('videoInfo').innerHTML : '
                    ${tiktokData.title || 'TiktokMedia'}
                    <span>@${tiktokData.author.unique_id || 'unkown'}</span>

                                // Cek apakah ini Video atau Foto (Slide)
                if (tiktokData.images && tiktokData.images.length > 0) {
                    // JIKA FOTO
                    const grid = document.createElement('div');
                    grid.className = 'photo-grid';
                    
                    tiktokData.images.forEach((imgUrl, index) => {
                        const div = document.createElement('div');
                        div.className = 'photo-item';
                        div.innerHTML = `
                            <img src="${imgUrl}" alt="Foto ${index + 1}">
                            <button class="btn-save-img" onclick="forceDownload('${imgUrl}', 'TikTok-Photo-${index+1}.jpg')">⬇ Save</button>
                        `;
                        grid.appendChild(div);
                    });
                    mediaContainer.appendChild(grid);
                    actionButtons.innerHTML = `<button class="btn-save" onclick="forceDownload('${tiktokData.images[0]}', 'TikTok-Photo-1.jpg')">Download Foto Pertama</button>`;

                } else {
                    // JIKA VIDEO
                    currentMediaUrl = tiktokData.play;
                    
                    const video = document.createElement('video');
                    video.className = 'video-preview';
                    video.src = currentMediaUrl;
                    video.controls = true;
                    mediaContainer.appendChild(video);

                    actionButtons.innerHTML = `<button class="btn-save" onclick="forceDownload('${currentMediaUrl}', 'TikTok-Video.mp4')">Simpan Video ke Galeri</button>`;
                }

                resultBox.style.display = 'block';
            } else {
                alert(data.msg || "Gagal memproses link. Pastikan link valid.");
            }

        } catch (error) {
            console.error(error);
            status.style.display = 'none';
            submitBtn.disabled = false;
            alert("Terjadi kesalahan jaringan. Coba lagi nanti.");
        }
    }

    // FUNGSI SAKTI BUAT MAKSA DOWNLOAD (VIDEO/FOTO)
    async function forceDownload(url, filename) {
        try {
            // Ambil data file
            const response = await fetch(url);
            const blob = await response.blob();
            
            // Bikin URL internal browser
            const downloadUrl = window.URL.createObjectURL(blob);
            
            // Bikin elemen <a> tersembunyi buat nge-trigger download
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            
            // Bersihin memori
            window.URL.revokeObjectURL(downloadUrl);
        } catch (err) {
            alert("Gagal mengunduh. Coba pencet kanan / tahan gambar lalu pilih 'Save'.");
        }
                    
                // 1. Set link video (Play tanpa watermark)
                const videoUrl = videoData.play; 
                const downloadUrl = videoUrl.includes ('?') ? videoUrl + '&download=1' : videoUrl + '?download=1'
                document.getElementById('videoPreview').src = videoUrl
                document.getElementById('downloadBtn').href = downloadUrl

                
                // 2. Set teks info (Judul & Author)
                document.getElementById('videoInfo').innerHTML = `
                    ${videoData.title || 'Video TikTok'}
                    <span>@${videoData.author.unique_id || 'unknown'}</span>
                `;

                // 3. Tampilkan kotak hasil
                resultBox.style.display = 'block';
            } else {
                alert("Gagal mengambil video. Pastikan link TikTok valid, publik, dan tidak di-private.");
            }

        } catch (error) {
            console.error(error);
            status.style.display = 'none';
            submitBtn.disabled = false;
            alert("Terjadi kesalahan jaringan. Coba lagi nanti.");
        }
    }
</script>

</body>
</html>
